name: Release

on:
  # v で始まるタグを push したら、配布物を作って GitHub Release（下書き）に添付する
  push:
    tags: ['v*']
  # 配布の仕組みを変更した PR では、公開せずに配布物の作成だけを試す
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'tools/sbom/**'
      - 'CMakePresets.json'

# 既定は読み取りのみ。書き込みが必要なジョブだけ個別に権限を与える
permissions:
  contents: read

jobs:
  package-windows:
    name: Package (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base

      - name: Configure
        run: cmake --preset release

      # バージョンの情報源は CMakeLists.txt の project(VERSION) だけにする。
      # タグと食い違っていたら公開しない
      - name: Check version
        id: version
        run: |
          version=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/release/CMakeCache.txt)
          echo "Project version: ${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build
        run: cmake --build --preset release

      # 配布するのと同じ Release ビルドでテストする
      - name: Test
        run: ctest --preset release

      - name: Package
        run: ./packaging/windows/package.sh build/release dist "${{ steps.version.outputs.version }}"

      # MSYS2 の外（PATH に MSYS2 がない状態）で起動できるか確かめる
      - name: Smoke test
        shell: pwsh
        timeout-minutes: 5
        run: |
          $dir = "dist/NumberGuessGame-v${{ steps.version.outputs.version }}-windows-x64"
          foreach ($exe in @("NumberGuessGame.exe", "NumberGuessGameQt.exe")) {
            $p = Start-Process -FilePath "$dir/$exe" -ArgumentList "--version" `
                   -RedirectStandardOutput "$exe.out" -NoNewWindow -Wait -PassThru
            $out = Get-Content "$exe.out" -Raw
            Write-Host "${exe}: $out"
            if ($p.ExitCode -ne 0) { throw "$exe exited with code $($p.ExitCode)" }
            if ($out -notmatch "${{ steps.version.outputs.version }}") { throw "$exe printed an unexpected version" }
          }

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.packages.tsv
          if-no-files-found: error

  # 配布物に含まれる部品（Qt・ICU・コンパイラのランタイムなど）の一覧を、
  # 標準形式（SPDX 2.3）の SBOM として作り、形式を検証する
  sbom:
    name: Generate SBOM
    needs: package-windows
    runs-on: ubuntu-24.04
    env:
      NAME: NumberGuessGame-v${{ needs.package-windows.outputs.version }}-windows-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-package
          path: dist

      - name: Install tools
        run: |
          python3 -m venv "${RUNNER_TEMP}/sbom-venv"
          "${RUNNER_TEMP}/sbom-venv/bin/pip" install --quiet -r tools/sbom/requirements.txt
          echo "${RUNNER_TEMP}/sbom-venv/bin" >> "${GITHUB_PATH}"

      - name: Generate SBOM
        env:
          VERSION: ${{ needs.package-windows.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # 同じコミットからは同じ SBOM になるよう、作成日時にコミットの日時を使う
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          python3 packaging/sbom/generate_spdx.py \
            --zip "dist/${NAME}.zip" \
            --packages "dist/${NAME}.packages.tsv" \
            --version "${VERSION}" \
            --repository "${REPO}" \
            --commit "${GITHUB_SHA}" \
            --license-file LICENSE \
            --output "dist/${NAME}.spdx.json"

      - name: Validate SBOM
        run: pyspdxtools -i "dist/${NAME}.spdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: dist/*.spdx.json
          if-no-files-found: error

  # 配布物に「このリポジトリの、このワークフローの、このコミットから作られた」ことを示す
  # 署名付きの来歴証明（SLSA build provenance）を付ける。
  # 署名に必要な権限は、ビルドとは別のこのジョブだけに与える
  attest:
    name: Attest build provenance and SBOM
    needs: [package-windows, sbom]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    env:
      NAME: NumberGuessGame-v${{ needs.package-windows.outputs.version }}-windows-x64
    permissions:
      id-token: write           # Sigstore の署名用証明書を得るための OIDC トークン
      attestations: write       # 来歴証明をリポジトリに保存する
      artifact-metadata: write  # 配布物の記録を保存する
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '{windows-package,sbom}'
          merge-multiple: true
          path: dist

      # どのワークフロー・コミットから作られたか（SLSA build provenance）
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.NAME }}.zip

      # 何が含まれているか（SBOM）。zip と SBOM の対応を署名付きで記録する
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.NAME }}.zip
          sbom-path: dist/${{ env.NAME }}.spdx.json

  publish:
    name: Publish GitHub Release (draft)
    needs: [package-windows, attest]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    env:
      NAME: NumberGuessGame-v${{ needs.package-windows.outputs.version }}-windows-x64
    permissions:
      contents: write   # Release の作成と配布物の添付に必要
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '{windows-package,sbom}'
          merge-multiple: true
          path: dist

      # 公開する前に、来歴証明とチェックサムを利用者と同じ方法で検証する
      - name: Verify package
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum --check "${NAME}.zip.sha256"
          gh attestation verify "${NAME}.zip" --repo "${REPO}"
          gh attestation verify "${NAME}.zip" --repo "${REPO}" \
            --predicate-type https://spdx.dev/Document/v2.3

      # 既に Release があれば配布物を差し替え、なければ下書きとして作る
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # 公開するのは zip・チェックサム・SBOM の 3 つ（.packages.tsv は SBOM の材料なので公開しない）
          files=("dist/${NAME}.zip" "dist/${NAME}.zip.sha256" "dist/${NAME}.spdx.json")
          if gh release view "${TAG}" --repo "${REPO}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --clobber --repo "${REPO}"
          else
            gh release create "${TAG}" "${files[@]}" --repo "${REPO}" \
              --draft --verify-tag --generate-notes --title "${TAG}"
          fi
