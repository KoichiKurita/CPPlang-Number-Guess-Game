name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# 最小権限: このワークフローはリポジトリの読み取りしか必要としない
permissions:
  contents: read

# 同じブランチ/PR で新しい実行が始まったら、古い実行はキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-mingw:
    name: Windows (MinGW GCC)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base

      - name: Configure
        shell: msys2 {0}
        run: cmake --preset qt

      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset qt

      - name: Test
        shell: msys2 {0}
        run: ctest --preset qt

  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake --preset msvc

      - name: Build
        run: cmake --build --preset msvc

      - name: Test
        run: ctest --preset msvc

  linux-sanitizers:
    name: Linux (${{ matrix.compiler.name }}, ASan + UBSan)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false   # 片方が失敗しても、もう片方の結果も確認できるようにする
      matrix:
        compiler:
          - { name: GCC,   cc: gcc,   cxx: g++,     packages: "" }
          - { name: Clang, cc: clang, cxx: clang++, packages: "libclang-rt-dev" }  # Clang のサニタイザ用ランタイム
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.compiler.packages }}

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      - name: Test
        run: ctest --preset asan
        
  fuzzing:
    name: Fuzzing (libFuzzer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libclang-rt-dev   # libFuzzer とサニタイザのランタイム

      - name: Configure
        run: cmake --preset fuzz

      - name: Build
        run: cmake --build --preset fuzz

      # 単体テストと、シードの入力（fuzz/corpus）での回帰テスト
      - name: Test
        run: ctest --preset fuzz

      # 各ファジング用の関数を 60 秒ずつ実行する。
      # 新しく見つかった入力は作業用のフォルダ（work/）に、問題を起こした入力は crashes/ に保存される
      - name: Fuzz
        run: |
          mkdir -p crashes
          for target in input_parser player_name csv timestamp; do
            echo "::group::fuzz_${target}"
            mkdir -p "work/${target}"
            "build/fuzz/fuzz/fuzz_${target}" \
              -max_total_time=60 -timeout=5 -print_final_stats=1 \
              -artifact_prefix="crashes/${target}-" \
              "work/${target}" "fuzz/corpus/${target}"
            echo "::endgroup::"
          done

      # 問題を起こした入力を保存し、手元で再現できるようにする
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: crashes/
          if-no-files-found: ignore

  linux-qt:
    name: Linux (GCC, Qt GUI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev

      - name: Configure
        run: cmake --preset qt

      - name: Build
        run: cmake --build --preset qt

      - name: Test
        run: ctest --preset qt

  lint:
    name: Lint (clang-format, clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ローカル（MSYS2 の LLVM 23）と同じ系列のバージョンに固定する
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev
          python3 -m venv "${RUNNER_TEMP}/lint-venv"
          "${RUNNER_TEMP}/lint-venv/bin/pip" install --quiet --require-hashes -r tools/lint/requirements.txt
          echo "${RUNNER_TEMP}/lint-venv/bin" >> "${GITHUB_PATH}"

      - name: Show tool versions
        run: |
          clang-format --version
          clang-tidy --version

      - name: Check formatting
        run: git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run --Werror

      # すべての Action がコミットハッシュ（40 桁）で固定されていることを確認する
      - name: Check actions are pinned
        run: |
          unpinned=$(grep -rnE '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows \
            | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [[ -n "${unpinned}" ]]; then
            echo "::error::Actions must be pinned to a full-length commit SHA"
            echo "${unpinned}"
            exit 1
          fi

      - name: Configure
        run: cmake --preset tidy

      # コンパイルと同時に clang-tidy を実行する（指摘があればビルドが失敗する）
      - name: Build with clang-tidy
        run: cmake --build --preset tidy

        
  coverage:
    name: Coverage (gcov, lcov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev lcov

      - name: Configure
        run: cmake --preset coverage

      - name: Build
        run: cmake --build --preset coverage

      - name: Test
        run: ctest --preset coverage

      - name: Generate report
        run: |
          ./scripts/coverage.sh build/coverage coverage
          {
            echo '### Coverage'
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: coverage/html

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.info
          disable_search: true
          fail_ci_if_error: true
