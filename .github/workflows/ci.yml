name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# 最小権限: このワークフローはリポジトリの読み取りしか必要としない
permissions:
  contents: read

# 同じブランチ/PR で新しい実行が始まったら、古い実行はキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-mingw:
    name: Windows (MinGW GCC)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base

      - name: Configure
        shell: msys2 {0}
        run: cmake --preset qt

      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset qt

      - name: Test
        shell: msys2 {0}
        run: ctest --preset qt

  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure
        run: cmake --preset msvc

      - name: Build
        run: cmake --build --preset msvc

      - name: Test
        run: ctest --preset msvc

  linux-sanitizers:
    name: Linux (${{ matrix.compiler.name }}, ASan + UBSan)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false   # 片方が失敗しても、もう片方の結果も確認できるようにする
      matrix:
        compiler:
          - { name: GCC,   cc: gcc,   cxx: g++,     packages: "" }
          - { name: Clang, cc: clang, cxx: clang++, packages: "libclang-rt-dev" }  # Clang のサニタイザ用ランタイム
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.compiler.packages }}

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      - name: Test
        run: ctest --preset asan

  linux-qt:
    name: Linux (GCC, Qt GUI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev

      - name: Configure
        run: cmake --preset qt

      - name: Build
        run: cmake --build --preset qt

      - name: Test
        run: ctest --preset qt

  lint:
    name: Lint (clang-format, clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ローカル（MSYS2 の LLVM 23）と同じ系列のバージョンに固定する
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev
          pipx install clang-format==23.1.3
          pipx install clang-tidy==23.1.4
          clang-format --version
          clang-tidy --version

      - name: Check formatting
        run: git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run --Werror

      # すべての Action がコミットハッシュ（40 桁）で固定されていることを確認する
      - name: Check actions are pinned
        run: |
          unpinned=$(grep -rnE '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows \
            | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [[ -n "${unpinned}" ]]; then
            echo "::error::Actions must be pinned to a full-length commit SHA"
            echo "${unpinned}"
            exit 1
          fi

      - name: Configure
        run: cmake --preset tidy

      # コンパイルと同時に clang-tidy を実行する（指摘があればビルドが失敗する）
      - name: Build with clang-tidy
        run: cmake --build --preset tidy

        
  coverage:
    name: Coverage (gcov, lcov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev lcov

      - name: Configure
        run: cmake --preset coverage

      - name: Build
        run: cmake --build --preset coverage

      - name: Test
        run: ctest --preset coverage

      - name: Generate report
        run: |
          ./scripts/coverage.sh build/coverage coverage
          {
            echo '### Coverage'
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-html
          path: coverage/html

      - name: Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.info
          disable_search: true
          fail_ci_if_error: true
