# Codecov の設定 https://docs.codecov.com/docs/codecov-yaml
coverage:
  status:
    # リポジトリ全体のカバレッジ: 比較元（develop / main）から 1% を超えて下がったら失敗
    project:
      default:
        target: auto
        threshold: 1%
    # PR で追加・変更した行のカバレッジ: 80% 以上をテストする
    patch:
      default:
        target: 80%

comment:
  layout: "diff, files"
  require_changes: false

# テストコード自体は計測の対象外（scripts/coverage.sh でも除外している）
ignore:
  - "tests/**"
  - "qt/tests/**"
